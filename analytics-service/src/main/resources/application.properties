spring.application.name=analytics-service

server.port=4002

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.jpa.properties.hibernate.default_schema=public

spring.mail.host=${MAILTRAP_HOST}
spring.mail.port=${MAILTRAP_PORT}
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.kafka.consumer.group-id=analytics-service
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}

spring.cloud.consul.host=consul
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
spring.cloud.consul.discovery.instance-id=${spring.application.name}-${server.port}
management.endpoints.web.exposure.include=health,info

restcountries.base-url=https://restcountries.com/v3.1

#Circuit Breaker for Wikipedia API
resilience4j.circuitbreaker.instances.wikipediaApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.wikipediaApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.wikipediaApi.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.wikipediaApi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.wikipediaApi.automatic-transition-from-open-to-half-open-enabled=true

#Circuit Breaker for RestCountries API
resilience4j.circuitbreaker.instances.countriesApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.countriesApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.countriesApi.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.countriesApi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.countriesApi.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.timelimiter.instances.wikipediaApi.timeout-duration=3s
resilience4j.timelimiter.instances.countriesApi.timeout-duration=3s

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
