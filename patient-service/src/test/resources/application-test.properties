# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true

spring.flyway.enabled=false

# Disable external services for testing
spring.cloud.consul.enabled=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
management.tracing.enabled=false
grpc.server.port=-1
app.cache.redis.enabled=false
spring.cache.type=simple

# Use local, non-placeholder connection settings so the Spring context can be
# created without the Docker Compose environment.
spring.data.redis.host=localhost
spring.data.redis.port=6379

grpc.billing-service.host=localhost
grpc.billing-service.port=9090
billing.service.address=localhost
billing.service.grpc.port=9001

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.fail-fast=false
