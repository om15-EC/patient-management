
services:
  # ================================
  # DATABASES
  # ================================

  auth-service-db:
    image: postgres:latest
    container_name: auth-service-db
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5001:5432"
    volumes:
      - auth-service-db:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  patient-service-db:
    image: postgres:latest
    container_name: patient-service-db
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - patient-service-db:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  billing-service-db:
    image: postgres:latest
    container_name: billing-service-db
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5002:5432"
    volumes:
      - billing-service-db:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  analytics-service-db:
    image: postgres:latest
    container_name: analytics-service-db
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5003:5432"
    volumes:
      - analytics-service-db:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ================================
  # KAFKA
  # ================================

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka:/var/lib/kafka
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s


  # ================================
  # REDIS
  # ================================

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev-redis-password}"]
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ================================
  # SERVICES
  # ================================


  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "4005:4005"
      - "5005:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JTW_EXPIRATION: ${JWT_EXPIRATION}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    depends_on:
      auth-service-db:
        condition: service_healthy
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4005/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  patient-service:
    build:
      context: .
      dockerfile: Dockerfile.patient-service
    container_name: patient-service
    ports:
      - "127.0.0.1:4000:4000"
      - "5006:5006"
    environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/db
        SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
        SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
        SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        BILLING_SERVICE_ADDRESS: billing-service
        BILLING_SERVICE_GRPC_PORT: 9001
        SPRING_DATA_REDIS_HOST: redis
        SPRING_DATA_REDIS_PORT: 6379
        SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
        INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-token}
        MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
        MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
        JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006"
    depends_on:
        patient-service-db:
          condition: service_healthy
        kafka:
          condition: service_healthy
        billing-service:
          condition: service_healthy
        consul:
          condition: service_healthy
        logstash:
          condition: service_started
        zipkin:
          condition: service_healthy
    networks:
        - internal
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  billing-service:
    build:
      context: .
      dockerfile: Dockerfile.billing-service
    container_name: billing-service
    ports:
      - "4001:4001"
      - "9001:9001"
      - "5007:5007"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://billing-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      billing-service-db:
        condition: service_healthy
      consul:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4001/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.analytics-service
    container_name: analytics-service
    ports:
      - "4002:4002"
      - "5008:5008"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://analytics-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAILTRAP_HOST: ${MAILTRAP_HOST}
      MAILTRAP_PORT: ${MAILTRAP_PORT}
      MAILTRAP_USERNAME: ${MAILTRAP_USERNAME}
      MAILTRAP_PASSWORD: ${MAILTRAP_PASSWORD}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5008"
#      API_NINJAS_KEY: ${API_NINJAS_KEY}
    depends_on:
      analytics-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      consul:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4002/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "4004:4004"
      - "5009:5009"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-token}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5009"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
#      REMOVE JAVA_TOOLS_OPTIONS IN PRODUCTION ENTIRELY.
    depends_on:
      auth-service:
        condition: service_started
      patient-service:
        condition: service_started
      billing-service:
        condition: service_started
      analytics-service:
        condition: service_started
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - internal

  consul:
    image: hashicorp/consul:1.21
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: >
      consul agent -server 
      -bootstrap-expect=1
      -ui
      -client=0.0.0.0
      -bind=0.0.0.0
      -data-dir=/consul/data
      -rejoin
      -retry-join=consul
    volumes:
      - consul-data:/consul/data
    networks:
      - internal
    environment:
      - CONSUL_LOCAL_CONFIG={"server_rejoin_age_max":"720h"}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8500/v1/status/leader" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  logstash:
    image: logstash:8.12.0
    container_name: logstash
    ports:
      - "5044:5044"
      - "5004:5000/tcp"
      - "5004:5000/udp"
      - "9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    networks:
      - internal
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9600 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kibana:
    image: kibana:8.12.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - internal
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9411 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s


# ================================
# VOLUMES
# ================================

volumes:
  auth-service-db:
  patient-service-db:
  billing-service-db:
  analytics-service-db:
  kafka:
  consul-data:
  redis-data:
  elasticsearch-data:

# ================================
# NETWORKS
# ================================

networks:
  internal:
    driver: bridge

